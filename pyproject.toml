[project]
name = "itsa-agente"
version = "0.1.2"
description = "Chat estruturado com agentes especialistas para ERP, sobre a API IAitsaGateway."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["itsa_agente*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S"]
ignore = [
    "S101",   # assert é usado nos testes
    "RUF001", # acentuação em strings é intencional (pt-BR)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["itsa_agente", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["itsa_agente"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true
follow_imports = "skip"
